
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculator">
        <h1>Student Grade Calculator</h1>
        <p class="subtitle">Enter your marks to calculate your result.</p>

        <form id="grade-form">
            <label for="subject1">Mathematics</label>
            <input type="number" id="subject1" min="0" max="100"
                step="any" placeholder="Marks out of 100" required>

            <label for="subject2">Computer Science</label>
            <input type="number" id="subject2" min="0" max="100"
                step="any" placeholder="Marks out of 100" required>

            <label for="subject3">Physics</label>
            <input type="number" id="subject3" min="0" max="100"
                step="any" placeholder="Marks out of 100" required>

            <label for="subject4">English</label>
            <input type="number" id="subject4" min="0" max="100"
                step="any" placeholder="Marks out of 100" required>

            <label for="subject5">Artificial Intelligence</label>
            <input type="number" id="subject5" min="0" max="100"
                step="any" placeholder="Marks out of 100" required>

            <button type="submit">Calculate Result</button>
        </form>

        <section id="result" aria-live="polite" hidden>
            <h2>Your Result</h2>
            <p id="total"></p>
            <p id="percentage"></p>
            <p id="grade"></p>
        </section>

        <a href="../../index.html" class="back-link">
            ← Back to Portfolio
        </a>
    </main>

    <script src="script.js"></script>
</body>
</html>
